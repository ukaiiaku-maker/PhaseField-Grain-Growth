[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grain-growth-pf"
version = "0.1.0"
description = "Event-resolved stochastic disconnection-mediated multiphase-field grain growth"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6",
]

[project.optional-dependencies]
analysis = ["pandas>=2", "matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
ggpf-run = "grain_growth_pf.cli:run_main"
ggpf-campaign = "grain_growth_pf.cli:campaign_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

