prepare_initial_conditions: true
temperatures: [900.0]
seeds: [5101]
base:
  regime: G_REF
  seed: 5101
  pf:
    shape: [192, 192]
    grid_spacing: 1.0
    interface_width: 4.0
    time_step: 0.04
    gb_energy: 1.0
    intrinsic_mobility: 4.0
    boundary_conditions: periodic
    temperature: 900.0
    adaptive_stepping: true
    grain_extinction_threshold: 0.5
  mechanics_backend: none
  compatibility_model: off
  active_modules: []
  output_cadence: 4
  max_steps: 1400
  termination_grains: 130
  parameters:
    initial_grains: 267
    equilibration_steps: 20
    equilibrate_to_grains: 200
    equilibration_max_steps: 1200
    compact_after_equilibration: true
    event_domain_length: 12.0
    arclength_domains: true
    encounter_density: 0.20
    barrier_core_ev: 0.25
    b_coefficient_ev: 0.02
    h_coefficient_ev: 0.02
    attempt_frequency: 10.0
    packet_size: 2.0
    packet_window_time: 1.0
    pinned_mobility_fraction: 0.0
    migration_closure: gate_only
    blocked_gate_profile: line
    tj_correlation_radius: 0
    tj_correlation_length: 2.0
    tj_barrier_ev: 0.55
    tj_attempt_frequency: 1000.0
    shear_stiffness: 0.20
    shear_trigger: 0.25
    easy_beta: 0.35
    excess_volume_per_area: 0.01
    point_defect_formation_volume: 0.02
    free_volume_stiffness: 0.05
    climb_trigger_quota: 0.25
    climb_release_quota: 1.0
    nucleation_prefactor: 100000.0
    exchange_prefactor: 100000.0
    transport_prefactor: 100000.0
    nucleation_barrier_ev: 0.45
    exchange_barrier_ev: 0.55
    transport_barrier_ev: 0.65
    event_ledger_format: parquet
regimes:
  G_LOW:
    modules: [gb_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {barrier_core_ev: 0.18}
  G_REF:
    modules: [gb_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {barrier_core_ev: 0.25}
  G_HIGH:
    modules: [gb_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {barrier_core_ev: 0.32}
  T_LOW:
    modules: [tj_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {tj_barrier_ev: 0.45}
  T_REF:
    modules: [tj_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {tj_barrier_ev: 0.55}
  T_HIGH:
    modules: [tj_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {tj_barrier_ev: 0.65}
  GT_LOW:
    modules: [gb_compatibility, tj_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {barrier_core_ev: 0.18, tj_barrier_ev: 0.45}
  GT_REF:
    modules: [gb_compatibility, tj_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {barrier_core_ev: 0.25, tj_barrier_ev: 0.55}
  GT_HIGH:
    modules: [gb_compatibility, tj_compatibility, multihit_persistent]
    compatibility_model: geometric_surrogate
    parameters: {barrier_core_ev: 0.32, tj_barrier_ev: 0.65}
  GS_PACKET_05:
    modules: [gb_compatibility, multihit_persistent, shear_memory]
    compatibility_model: geometric_surrogate
    mechanics_backend: local_memory
    parameters: {packet_size: 0.5}
  GS_PACKET_1:
    modules: [gb_compatibility, multihit_persistent, shear_memory]
    compatibility_model: geometric_surrogate
    mechanics_backend: local_memory
    parameters: {packet_size: 1.0}
  GS_PACKET_2:
    modules: [gb_compatibility, multihit_persistent, shear_memory]
    compatibility_model: geometric_surrogate
    mechanics_backend: local_memory
    parameters: {packet_size: 2.0}
  C_FAST:
    modules: [free_volume, serial_climb]
    parameters:
      nucleation_barrier_ev: 0.35
      exchange_barrier_ev: 0.45
      transport_barrier_ev: 0.55
  C_REF:
    modules: [free_volume, serial_climb]
  C_SLOW:
    modules: [free_volume, serial_climb]
    parameters:
      nucleation_barrier_ev: 0.55
      exchange_barrier_ev: 0.65
      transport_barrier_ev: 0.75
